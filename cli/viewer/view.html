<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SMAK viewer</title>
<style>
  :root { color-scheme: dark; --bg: #16181c; --panel: #1e2127; --line: #2c3038; --text: #d7dae0; --dim: #8a909c; --accent: #6fb3ff; --b: #ffb86b; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, Segoe UI, sans-serif; }
  body { display: grid; grid-template-columns: 250px 1fr; grid-template-rows: 1fr auto; }
  #list { grid-row: 1 / 3; overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line); padding: 8px 0; }
  #list h3 { margin: 10px 12px 4px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  #list .row { display: flex; align-items: center; padding: 0 6px 0 12px; }
  #list .row:hover { background: #262a32; }
  #list .name { flex: 1; padding: 3px 0; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #list button { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 3px; width: 22px; height: 20px; margin-left: 3px; cursor: pointer; font: 600 11px system-ui; padding: 0; }
  #list button.onA { background: var(--accent); color: #0b1220; border-color: var(--accent); }
  #list button.onB { background: var(--b); color: #20140a; border-color: var(--b); }
  #views { display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  #views.single { grid-template-columns: 1fr; } #views.single .view[data-k="B"] { display: none; }
  .view { position: relative; min-width: 0; min-height: 0; border-right: 1px solid var(--line); }
  .view canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  .view .tag { position: absolute; left: 10px; top: 8px; font-weight: 600; pointer-events: none; text-shadow: 0 1px 2px #000; }
  .view[data-k="A"] .tag b { color: var(--accent); } .view[data-k="B"] .tag b { color: var(--b); }
  .view .facts { position: absolute; left: 10px; bottom: 8px; color: var(--dim); font-size: 12px; pointer-events: none; text-shadow: 0 1px 2px #000; white-space: pre; }
  .view .tex { position: absolute; right: 8px; top: 8px; bottom: 8px; width: 150px; overflow-y: auto; display: none; }
  .view .tex img { width: 100%; display: block; margin-bottom: 4px; border: 1px solid var(--line); image-rendering: pixelated; background: #000; }
  .view .tex span { display: block; font-size: 11px; color: var(--dim); }
  body.textures .view .tex { display: block; }
  #bar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 8px 12px; background: var(--panel); border-top: 1px solid var(--line); }
  #bar label { display: flex; align-items: center; gap: 5px; color: var(--dim); }
  #bar select, #bar button, #bar input[type=text] { background: #2a2e36; color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 3px 7px; font: inherit; }
  #bar button { cursor: pointer; } #bar button:hover { border-color: var(--accent); }
  #frame { width: 200px; } #seq { max-width: 230px; }
  #hint { color: var(--dim); margin-left: auto; }
</style>
</head>
<body>
<div id="list"></div>
<div id="views">
  <div class="view" data-k="A"><canvas></canvas><div class="tag"></div><div class="facts"></div><div class="tex"></div></div>
  <div class="view" data-k="B"><canvas></canvas><div class="tag"></div><div class="facts"></div><div class="tex"></div></div>
</div>
<div id="bar">
  <label>animation <select id="seq"></select></label>
  <button id="play">pause</button>
  <label>frame <input id="frame" type="range" min="0" max="30" value="0"><span id="frameNo">0</span></label>
  <label>speed <select id="speed"><option value="0.25">¼</option><option value="0.5">½</option><option value="1" selected>1</option></select></label>
  <label><input id="two" type="checkbox" checked> side by side</label>
  <label><input id="lit" type="checkbox" checked> light</label>
  <label><input id="cull" type="checkbox" checked> one-sided</label>
  <label><input id="tex" type="checkbox"> textures</label>
  <label>ground <select id="ground"><option value="0.23,0.24,0.27">grey</option><option value="0.05,0.05,0.06">dark</option><option value="0.55,0.57,0.6">light</option><option value="0.2,0.32,0.2">green</option></select></label>
  <button id="front">front</button><button id="back">back</button><button id="left">left</button><button id="right">right</button>
  <span id="hint">drag: turn · wheel: zoom · right drag: move · A / B: put a model in a pane</span>
</div>
<script type="module">
const $ = (s) => document.querySelector(s), api = (p) => fetch(p).then((r) => { if (!r.ok) throw new Error(p); return r; });
const cam = { yaw: 25, pitch: 8, zoom: 1, panX: 0, panZ: 0 }, play = { on: true, seq: 0, frame: 0, speed: 1 };
const VS = `attribute vec3 p; attribute vec3 n; attribute vec2 t; uniform mat4 M; uniform mat3 R; varying vec2 vt; varying float vl;
  void main() { gl_Position = M * vec4(p, 1.0); vt = t; vec3 e = normalize(R * n); vl = 0.42 + 0.72 * max(0.0, dot(e, normalize(vec3(-0.35, -0.75, 0.55)))) + 0.14 * max(0.0, -e.x); }`;
const FS = `precision mediump float; uniform sampler2D S; uniform float lit; uniform float hole; varying vec2 vt; varying float vl;
  void main() { vec4 c = texture2D(S, vt); if (hole > 0.5 && c.a < 0.5) discard; gl_FragColor = vec4(c.rgb * mix(1.0, vl, lit), 1.0); }`;

class Pane {
  constructor(el) {
    this.el = el; this.k = el.dataset.k; this.canvas = el.querySelector("canvas"); this.id = null; this.model = null; this.frames = new Map(); this.shown = null;
    const gl = this.gl = this.canvas.getContext("webgl", { antialias: true });
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
    const pr = this.pr = gl.createProgram(); gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(pr); gl.useProgram(pr);
    this.loc = { p: gl.getAttribLocation(pr, "p"), n: gl.getAttribLocation(pr, "n"), t: gl.getAttribLocation(pr, "t"), M: gl.getUniformLocation(pr, "M"), R: gl.getUniformLocation(pr, "R"), lit: gl.getUniformLocation(pr, "lit"), hole: gl.getUniformLocation(pr, "hole") };
    this.geo = gl.createBuffer(); this.uv = gl.createBuffer(); this.tex = [];
    gl.enable(gl.DEPTH_TEST);
  }
  async load(id, name) {
    this.id = id; this.name = name; this.model = null; this.frames.clear(); this.shown = null; this.box = null;
    const model = await api(`/api/model?id=${encodeURIComponent(id)}`).then((r) => r.json()); if (this.id !== id) return;
    const gl = this.gl; gl.bindBuffer(gl.ARRAY_BUFFER, this.uv); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(model.uv), gl.STATIC_DRAW);
    for (const t of this.tex) gl.deleteTexture(t); this.waiting = 0;
    const box = this.el.querySelector(".tex"); box.innerHTML = "";
    this.tex = model.textures.map((t, n) => {
      const tex = gl.createTexture(), img = new Image(); img.src = `/api/texture?id=${encodeURIComponent(id)}&n=${n}&s=${Date.now()}`;
      gl.bindTexture(gl.TEXTURE_2D, tex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([90, 90, 90, 255]));
      this.waiting++; img.onload = () => { this.waiting--; gl.bindTexture(gl.TEXTURE_2D, tex); gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img); for (const [k, v] of [[gl.TEXTURE_WRAP_S, gl.REPEAT], [gl.TEXTURE_WRAP_T, gl.REPEAT], [gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
        // sizes that are not a power of two cannot repeat in WebGL 1: clamp those
        const pow = (v) => (v & (v - 1)) === 0; if (!pow(img.width) || !pow(img.height)) { gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE); } };
      const cap = document.createElement("span"); cap.textContent = `${t.name}  ${t.width}x${t.height}`; box.append(cap, img);
      return tex;
    });
    this.model = model;
    this.el.querySelector(".tag").innerHTML = `<b>${this.k}</b> &nbsp;${name}`;
    const c = model.check, verdict = c.errors.length ? `${c.errors.length} errors` : c.warnings.length ? `fits GoldSrc, ${c.warnings.length} warning` : "fits GoldSrc";
    this.el.querySelector(".facts").textContent = `${model.triangles} triangles · ${model.textures.length} textures · ${model.bones} bones · ${model.sequences.length} animations\n${(model.bytes / 1024).toFixed(0)} KB · ${verdict}\n${model.submodels.map((s) => `${s.name}: ${s.points} points`).join(" · ")}`;
    onModel(this);
  }
  async frame(seq, fr) {
    const key = `${seq}:${fr}`; if (this.frames.has(key)) return this.frames.get(key);
    const id = this.id, want = api(`/api/frame?id=${encodeURIComponent(id)}&seq=${seq}&frame=${fr}`).then((r) => r.arrayBuffer()).then((b) => new Float32Array(b));
    this.frames.set(key, want); const got = await want; if (this.id === id) this.frames.set(key, got); return got;
  }
  draw() {
    const gl = this.gl, c = this.canvas, w = c.clientWidth * devicePixelRatio | 0, h = c.clientHeight * devicePixelRatio | 0;
    if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
    const bg = $("#ground").value.split(",").map(Number); gl.viewport(0, 0, w, h); gl.clearColor(bg[0], bg[1], bg[2], 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    const m = this.model; if (!m) return;
    const seq = Math.min(play.seq, m.sequences.length - 1), fr = Math.min(Math.floor(play.frame), m.sequences[seq].frames - 1), data = this.frames.get(`${seq}:${fr}`);
    if (!(data instanceof Float32Array)) { this.frame(seq, fr); if (!this.shown) return; }
    else if (this.shown !== data) { gl.bindBuffer(gl.ARRAY_BUFFER, this.geo); gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW); this.shown = data;
      if (!this.box) { let lo = [1e9, 1e9, 1e9], hi = [-1e9, -1e9, -1e9]; for (let i = 0; i < data.length; i += 6) for (let a = 0; a < 3; a++) { lo[a] = Math.min(lo[a], data[i + a]); hi[a] = Math.max(hi[a], data[i + a]); } this.box = { mid: lo.map((v, a) => (v + hi[a]) / 2), far: Math.max(1, Math.hypot(...hi.map((v, a) => v - lo[a])) / 2) }; } }
    // the camera stands at `yaw` round the model (0: in front of it, looking back along -x) and `pitch` above; z is up
    const y = cam.yaw * Math.PI / 180, p = cam.pitch * Math.PI / 180, cy = Math.cos(y), sy = Math.sin(y), cp = Math.cos(p), sp = Math.sin(p);
    const right = [-sy, cy, 0], up = [-sp * cy, -sp * sy, cp], back = [cp * cy, cp * sy, sp];       // towards the camera
    const far = (PANES.A.box ?? this.box).far, mid = this.box.mid, s = cam.zoom / far, asp = w / h, o = [mid[0], mid[1], mid[2] + cam.panZ * far];
    const row = (v, k) => [v[0] * k, v[1] * k, v[2] * k, -(v[0] * o[0] + v[1] * o[1] + v[2] * o[2]) * k];
    const X = row(right, s / asp), Y = row(up, s), Zr = row(back, -0.2 / far); X[3] += cam.panX;
    gl.useProgram(this.pr);
    gl.uniformMatrix4fv(this.loc.M, false, new Float32Array([X[0], Y[0], Zr[0], 0, X[1], Y[1], Zr[1], 0, X[2], Y[2], Zr[2], 0, X[3], Y[3], Zr[3], 1]));
    gl.uniformMatrix3fv(this.loc.R, false, new Float32Array([right[0], up[0], back[0], right[1], up[1], back[1], right[2], up[2], back[2]]));
    gl.uniform1f(this.loc.lit, $("#lit").checked ? 1 : 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.geo); gl.enableVertexAttribArray(this.loc.p); gl.vertexAttribPointer(this.loc.p, 3, gl.FLOAT, false, 24, 0); gl.enableVertexAttribArray(this.loc.n); gl.vertexAttribPointer(this.loc.n, 3, gl.FLOAT, false, 24, 12);
    gl.bindBuffer(gl.ARRAY_BUFFER, this.uv); gl.enableVertexAttribArray(this.loc.t); gl.vertexAttribPointer(this.loc.t, 2, gl.FLOAT, false, 0, 0);
    if ($("#cull").checked) { gl.enable(gl.CULL_FACE); gl.frontFace(FRONT_FACE === "cw" ? gl.CW : gl.CCW); gl.cullFace(gl.BACK); } else gl.disable(gl.CULL_FACE);
    const later = [];
    for (const r of m.runs) { const t = m.textures[r.tex]; if (t && t.flags & 32) { later.push(r); continue; } this.run(r, t); }
    if (later.length) { gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE); gl.depthMask(false); for (const r of later) this.run(r, m.textures[r.tex]); gl.depthMask(true); gl.disable(gl.BLEND); }
  }
  run(r, t) { const gl = this.gl; gl.bindTexture(gl.TEXTURE_2D, this.tex[r.tex] ?? null); gl.uniform1f(this.loc.hole, t && t.flags & 64 ? 1 : 0); gl.drawArrays(gl.TRIANGLES, r.start, r.count); }
}
// a compiled model's triangles go clockwise seen from outside; `?front=ccw` turns it round should a browser disagree
const asked = new URLSearchParams(location.search), FRONT_FACE = asked.get("front") ?? "cw";
const PANES = { A: new Pane($('.view[data-k="A"]')), B: new Pane($('.view[data-k="B"]')) };

// ── the list ──
const all = await api("/api/models").then((r) => r.json()), listEl = $("#list");
function put(k, m) { PANES[k].load(m.id, m.name); for (const b of listEl.querySelectorAll(`button.on${k}`)) b.classList.remove(`on${k}`); listEl.querySelector(`button[data-k="${k}"][data-id="${CSS.escape(m.id)}"]`)?.classList.add(`on${k}`); const u = new URL(location); u.searchParams.set(k.toLowerCase(), m.id); history.replaceState(null, "", u); }
for (const group of [...new Set(all.map((m) => m.group))]) {
  const h = document.createElement("h3"); h.textContent = group.replace(/^\d+_/, ""); listEl.append(h);
  for (const m of all.filter((x) => x.group === group)) {
    const row = document.createElement("div"); row.className = "row"; row.innerHTML = `<span class="name" title="${m.id}">${m.name}</span><button data-k="A" data-id="${m.id}">A</button><button data-k="B" data-id="${m.id}">B</button>`;
    row.querySelector(".name").onclick = () => put(lastPane, m); for (const b of row.querySelectorAll("button")) b.onclick = () => { lastPane = b.dataset.k; put(b.dataset.k, m); };
    listEl.append(row);
  }
}
let lastPane = "B";

// ── animation ──
function onModel(pane) {
  if (pane.k !== "A" && PANES.A.model) return;
  const sel = $("#seq"), was = sel.options[sel.selectedIndex]?.textContent; sel.innerHTML = "";
  pane.model.sequences.forEach((s, i) => { const o = document.createElement("option"); o.value = i; o.textContent = `${i} ${s.name}`; sel.append(o); });
  const again = [...sel.options].find((o) => o.textContent === was); const idle = pane.model.sequences.findIndex((q) => /idle/i.test(q.name)); sel.value = again ? again.value : asked.get("seq") ?? (idle >= 0 ? idle : 0); setSeq(Number(sel.value));
}
const seqOf = () => (PANES.A.model ?? PANES.B.model)?.sequences[play.seq];
function setSeq(i) { play.seq = i; play.frame = 0; const s = seqOf(); if (s) { $("#frame").max = s.frames - 1; } }
$("#seq").onchange = (e) => setSeq(Number(e.target.value));
$("#play").onclick = () => { play.on = !play.on; $("#play").textContent = play.on ? "pause" : "play"; };
$("#frame").oninput = (e) => { play.frame = Number(e.target.value); play.on = false; $("#play").textContent = "play"; };
$("#speed").onchange = (e) => { play.speed = Number(e.target.value); };
$("#two").onchange = (e) => $("#views").classList.toggle("single", !e.target.checked);
$("#tex").onchange = (e) => document.body.classList.toggle("textures", e.target.checked);
for (const [id, yaw] of [["front", 0], ["back", 180], ["left", 90], ["right", 270]]) $(`#${id}`).onclick = () => { cam.yaw = yaw; cam.pitch = 4; cam.panX = 0; cam.panZ = 0; };

// ── the camera: one for both panes ──
for (const pane of Object.values(PANES)) {
  const c = pane.canvas; let drag = null;
  c.onpointerdown = (e) => { drag = { x: e.clientX, y: e.clientY, move: e.button !== 0 || e.shiftKey }; c.setPointerCapture(e.pointerId); };
  c.onpointermove = (e) => { if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
    if (drag.move) { cam.panX += 2 * dx / c.clientWidth; cam.panZ += 2 * dy / c.clientHeight / cam.zoom; } else { cam.yaw = (cam.yaw - dx * 0.5 + 360) % 360; cam.pitch = Math.max(-89, Math.min(89, cam.pitch + dy * 0.4)); } };
  c.onpointerup = c.onpointercancel = () => { drag = null; };
  c.oncontextmenu = (e) => e.preventDefault();
  c.onwheel = (e) => { e.preventDefault(); cam.zoom = Math.max(0.4, Math.min(12, cam.zoom * Math.exp(-e.deltaY * 0.0012))); };
}

let last = performance.now();
function tick(now) {
  const dt = (now - last) / 1000; last = now; const s = seqOf();
  if (s) {
    if (play.on) { play.frame += dt * s.fps * play.speed; const n = Math.max(1, s.frames - 1); if (play.frame >= n) play.frame = s.loops ? play.frame % n : (play.frame > n + s.fps * 0.6 ? 0 : Math.min(play.frame, n + s.fps * 0.6)); }
    const f = Math.min(Math.floor(play.frame), s.frames - 1); $("#frame").value = f; $("#frameNo").textContent = `${f}/${s.frames - 1}`;
    // the next frames asked for ahead of time, so that playing does not wait
    for (const p of Object.values(PANES)) if (p.model) for (let k = 1; k <= 3; k++) { const q = p.model.sequences[Math.min(play.seq, p.model.sequences.length - 1)]; p.frame(Math.min(play.seq, p.model.sequences.length - 1), (f + k) % q.frames); }
  }
  for (const p of Object.values(PANES)) p.draw();
  window.lab = { ready: Object.values(PANES).every((p) => !p.id || (p.shown && p.tex.length && !p.waiting)), cam, play };
  requestAnimationFrame(tick);
}
const find = (id, n) => all.find((m) => m.id === id || m.name === id) ?? all[n];
if (all.length) { put("A", find(asked.get("a"), 0)); put("B", find(asked.get("b"), Math.min(1, all.length - 1))); } else listEl.innerHTML = "<h3>no .mdl files in the folders given</h3>";
if (asked.get("yaw")) cam.yaw = Number(asked.get("yaw")); if (asked.get("still")) { play.on = false; }
requestAnimationFrame(tick);
</script>
</body>
</html>
